{% extends "base.html" %}
{% block title %}Account Access – Lumière Restaurant{% endblock %}
{% block content %}
<div class="min-h-[82vh] flex items-center justify-center py-16 px-4">
    <div class="max-w-md w-full bg-white rounded-sm shadow-2xl p-8 sm:p-10 border border-amber-900/10">
        <!-- Logo Header -->
        <div class="text-center mb-8">
            <span class="text-gold uppercase tracking-[0.3em] text-[10px] font-semibold">Welcome to Lumière</span>
            <h2 class="font-serif text-3xl font-bold text-burgundy mt-1">Guest Portal</h2>
            <p class="text-xs text-neutral-500 mt-1">Sign in to manage table reservations and preferences.</p>
        </div>

        <!-- Tab Switcher -->
        <div class="flex border-b border-amber-900/10 mb-6 text-xs uppercase tracking-wider font-semibold">
            <button id="tab-login-btn" onclick="switchTab('login')" class="flex-1 py-3 border-b-2 border-burgundy text-burgundy transition-all">Sign In</button>
            <button id="tab-register-btn" onclick="switchTab('register')" class="flex-1 py-3 border-b-2 border-transparent text-neutral-400 hover:text-burgundy transition-all">Create Account</button>
        </div>

        <!-- Sign In Form -->
        <form id="form-login" method="POST" action="{{ url_for('auth') }}" class="space-y-4">
            <input type="hidden" name="action" value="login">
            <div>
                <label class="block text-xs uppercase tracking-wider font-semibold text-neutral-700 mb-1">Email Address</label>
                <div class="relative">
                    <input type="email" name="email" required placeholder="name@example.com" class="w-full bg-cream border border-neutral-300 p-3 rounded-sm text-sm focus:border-gold focus:outline-none pl-10">
                    <i class="fa-regular fa-envelope absolute left-3.5 top-3.5 text-neutral-400 text-xs"></i>
                </div>
            </div>
            <div>
                <label class="block text-xs uppercase tracking-wider font-semibold text-neutral-700 mb-1">Password</label>
                <div class="relative">
                    <input type="password" name="password" required placeholder="••••••••" class="w-full bg-cream border border-neutral-300 p-3 rounded-sm text-sm focus:border-gold focus:outline-none pl-10">
                    <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-neutral-400 text-xs"></i>
                </div>
            </div>
            <button type="submit" class="w-full bg-burgundy hover:bg-burgundyHover text-white py-3.5 text-xs uppercase tracking-widest font-semibold rounded-sm shadow-md transition-all mt-2">Sign In</button>
        </form>

        <!-- Register Form (Hidden by default) -->
        <form id="form-register" method="POST" action="{{ url_for('auth') }}" class="space-y-4 hidden">
            <input type="hidden" name="action" value="register">
            <div>
                <label class="block text-xs uppercase tracking-wider font-semibold text-neutral-700 mb-1">Full Name</label>
                <div class="relative">
                    <input type="text" name="name" required placeholder="e.g. John Doe" class="w-full bg-cream border border-neutral-300 p-3 rounded-sm text-sm focus:border-gold focus:outline-none pl-10">
                    <i class="fa-regular fa-user absolute left-3.5 top-3.5 text-neutral-400 text-xs"></i>
                </div>
            </div>
            <div>
                <label class="block text-xs uppercase tracking-wider font-semibold text-neutral-700 mb-1">Email Address</label>
                <div class="relative">
                    <input type="email" name="email" required placeholder="name@example.com" class="w-full bg-cream border border-neutral-300 p-3 rounded-sm text-sm focus:border-gold focus:outline-none pl-10">
                    <i class="fa-regular fa-envelope absolute left-3.5 top-3.5 text-neutral-400 text-xs"></i>
                </div>
            </div>
            <div>
                <label class="block text-xs uppercase tracking-wider font-semibold text-neutral-700 mb-1">Create Password</label>
                <div class="relative">
                    <input type="password" name="password" required placeholder="••••••••" class="w-full bg-cream border border-neutral-300 p-3 rounded-sm text-sm focus:border-gold focus:outline-none pl-10">
                    <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-neutral-400 text-xs"></i>
                </div>
            </div>
            <button type="submit" class="w-full bg-burgundy hover:bg-burgundyHover text-white py-3.5 text-xs uppercase tracking-widest font-semibold rounded-sm shadow-md transition-all mt-2">Create Account</button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    function switchTab(tab) {
        const loginBtn = document.getElementById('tab-login-btn');
        const regBtn = document.getElementById('tab-register-btn');
        const loginForm = document.getElementById('form-login');
        const regForm = document.getElementById('form-register');

        if (tab === 'login') {
            loginBtn.classList.add('border-burgundy', 'text-burgundy');
            loginBtn.classList.remove('border-transparent', 'text-neutral-400');
            regBtn.classList.remove('border-burgundy', 'text-burgundy');
            regBtn.classList.add('border-transparent', 'text-neutral-400');
            loginForm.classList.remove('hidden');
            regForm.classList.add('hidden');
        } else {
            regBtn.classList.add('border-burgundy', 'text-burgundy');
            regBtn.classList.remove('border-transparent', 'text-neutral-400');
            loginBtn.classList.remove('border-burgundy', 'text-burgundy');
            loginBtn.classList.add('border-transparent', 'text-neutral-400');
            regForm.classList.remove('hidden');
            loginForm.classList.add('hidden');
        }
    }
</script>
{% endblock %}
